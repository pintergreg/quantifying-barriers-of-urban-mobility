## -----------------------------------------------
## Basic Configuration
## -----------------------------------------------
baseurl = "/"
title = "Quantifying Barriers of Urban Mobility"
languageCode = "en-US"
defaultContentLanguage = "en"
theme = "hugo-story"
# theme = ["github.com/caressofsteel/hugo-story"]

## -----------------------------------------------
## Publish
## -----------------------------------------------

relativeURLs = "true"
#canonifyURLs = "true"

# Local
baseURL = "/"
publishDir = "public"

# Remote
#baseURL = "https://caressofsteel.github.io/demos/hugo/hugo-story/"
#publishDir = "//centos/sites/hugodev/hugostory/"


## -----------------------------------------------
## Hugo Built-in Features
## -----------------------------------------------

disableKinds = ["taxonomy", "section"]
# googleAnalytics = "your-google-analytics-id"

## -----------------------------------------------
## Site Parameters
## -----------------------------------------------

[Params]
  author = "Gergő Pintér"
  description = "Promotion webpage for the scientific paper Quantifying Barriers of Urban Mobility"
  keywords = ["mobile positioning data", "urban mobility", "community detection", "spatial barriers", "community severance"]
  images = ["images/louvain_communities.png"]

[Params.social]

[privacy]
  [privacy.googleAnalytics]
    disable = true
    respectDoNotTrack = true

[module]
  [[module.imports]]
    path = "github.com/caressofsteel/hugo-story"
    disable = true
