id: "liberty-bridge-intro"
title: "Closing the Liberty Bridge to vehicular traffic"
content: |
    Based on a community initiative, the Liberty Bride in Budapest was closed to vehicles on the weekends in July 2019, allowing people to use the bridge for recreational activities. For example, yoga and dance classes were held or people simply used the bridge for a picnic.
