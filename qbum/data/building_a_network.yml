title: "Building a network"
content: |
    How can you use a network to characterize the barriers of an urban landscape?
    A city's got all sorts of networks: roads, public transport, public utilities and so on.
    Yet, we build a different one based on how people move around in the city.

    A lot of smartphone apps and the services that power them collect geographic locations.
    Some companies collect this location info and provide it for research purposes.
    The mobile positioning data record includes a timestamp, a device ID, and a GPS location.
    These appearances are clustered into "stops", where someone spent some time.
    Then, every stop is mapped to a block of the city (as the figure shows), and considered a node of the network.
    The blocks are connected by edges if someone stops in two blocks in a row within a day.

