title: "Community fitting to District 15"
style: "style1 small lightbox onscroll-fade-in sad-gallery"
content: |
    As the Louvain resolution (&gamma;) increases the community matches the district boundary, which looses the community forming power at about &gamma; = 6.0, as the M3 motorway gradually cuts in half the community.
