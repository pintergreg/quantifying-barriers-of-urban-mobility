title: "Bridge closure case study"
content: |
    This event serves as a case study to analyze the barrier effect in a small-scale, local setting, where the  observation area is downtown Budapest.
    Note that smaller BCR means stronger barrier effect.
    During the bridge closure, the local mobility was affected; during the weekends of July 2019 the barrier effect is stronger than the reference weekends (June 2019).
style: "style1 small lightbox onscroll-fade-in"
