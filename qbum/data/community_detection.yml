title: "How to identify barriers in a network?"
content: |
    There's a cool technique called community detection, that can identify densely connected parts of a network, which are loosely connected to each other.
    A densely connected part is called a community, but what is more important right now is that the loosely connected path between them is a barrier.
    <br>
    <br>
    The figure shows two communities detected in Budapest, the barrier between them is the district boundary between district 4 (pink) and 15 (gray), as the pink one matched with district 4 and the gray one with district 15.
    Connections between the communities are yellow.
# Finally, the network is clustered into communities using the Louvain community detection algorithm.
