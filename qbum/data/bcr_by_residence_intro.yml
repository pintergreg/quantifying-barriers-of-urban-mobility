title: "Barrier Crossing Ratio by residence"
content: |
    Urban barriers can have a divergent impact on neighborhoods as individuals daily mobility depends largely on the locations of work, schools, and services that are unevenly distributed in and around cities.
    Thus, in the next step of the analysis, we assess the role of barriers in mobility by decomposing the set of individuals by areas of residence.

