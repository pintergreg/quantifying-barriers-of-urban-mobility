title: "What limits a community?"
content: |
    It was previously mentioned that communities match with districts.
    Is it possible to measure this matching?
    <br><br>
    Imagine two overlapping shapes, and the question is how well they match.
    If we rephrase the question, we want to know how big the non-matching parts, compared to the matching one.
    For example, the community area which is outside the districts, and the district area, that is not covered by the community.
    <br><br>
    Luckily, a method is already defined in mathematics, which can give an answer to the rephrased question, and it is called symmetric difference.
    The area of the blocks clustered as a community, but outside the target district, and the area of the district that is not covered by the community is summarized as a measure, and we call it Symmetric Area Difference.
    Lower values of this index mean a better fit of the detected mobility clusters to urban boundaries, as the error of the matching is smaller.
    <br><br>
    The figure on the right illustrates this method.
    We have a district with yellow, and a community with orange.
    They are overlapping, but a large part of the district is not covered, and at the same time, the community covert quite some area that does not belong to the district.
