title: "Counting barrier crossing"
content: |
    Now, that we've introduced the barrier effect using a network-science approach, let's examine how this affects the inhabitants of the city.
    <br>
    Let's focus on the individual trips in the city, and keep a record if a trip crosses a barrier (e.g., a district boundary, a busy multilane road, a railway, or a river).
    Furthermore, note down if a barrier crossing is also a community crossing.
    Have a look at the figure on the left for better understanding.
    <br>
    Then, we calculate the fraction of the barrier and the community crosses among all barrier crossings (separately by barrier types of <i>districts</i>, <i>neighborhoods</i>, <i>primary roads</i>, <i>secondary roads</i>, <i>railways</i>, and <i>rivers</i>), and take the inverse of this ratio.
    We call this measure, the Barrier Crossing Ratio, which describes that how much a given type of barrier affects to people.
    Budapest is divided by the river Danube, so it is an obvious barrier, but not every barrier is supposed to affect everyone the same way.
    It is important, that we do this for different resolution values, because the communities are formed differently at different resolutions, as it was shown before.
    <br><br>
    Why is this important, you might ask.
    Well, it gets interesting, when we sort people into different groups and examine how a given barrier affects these groups.
