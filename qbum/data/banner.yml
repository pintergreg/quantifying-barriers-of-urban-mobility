title: "Quantifying Barriers of Urban Mobility"
subtitle:
content: |
    A city is full of barriers that limit human mobility, some are visible, some are not.

    Administrative boundaries, natural obstacles, railways, roads: all can act as a barrier.

    In this study we introduce two indicators to quantify the barrier effect.
